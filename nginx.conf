user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    resolver 127.0.0.11 ipv6=off valid=10s;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    server {
        listen 80 default_server;
        server_name _;
        set $backend_upstream vape-group-backend:8088;
        set $frontend_upstream vape-group-frontend:3000;
        set $admin_upstream vape-group-admin:80;

        location = /__tenant_host_check {
            internal;
            proxy_pass http://$backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Tenant-Domain $host;
        }

        location /uploads/ {
            proxy_pass http://$backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /robots.txt {
            auth_request /__tenant_host_check;
            auth_request_set $tenant_primary_domain $upstream_http_x_primary_domain;
            if ($tenant_primary_domain != "") {
                return 301 $tenant_primary_domain$request_uri;
            }
            proxy_pass http://$frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Tenant-Domain $host;
        }

        location = /sitemap.xml {
            auth_request /__tenant_host_check;
            auth_request_set $tenant_primary_domain $upstream_http_x_primary_domain;
            if ($tenant_primary_domain != "") {
                return 301 $tenant_primary_domain$request_uri;
            }
            proxy_pass http://$frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Tenant-Domain $host;
        }

        # API 代理到后端
        location /api/ {
            proxy_pass http://$backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Tenant-Domain $host;
            proxy_cache_bypass $http_upgrade;
        }

        location = /fuck {
            auth_request off;
            return 301 /fuck/;
        }

        location ^~ /fuck/ {
            auth_request off;
            proxy_pass http://$admin_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # 前端应用
        location / {
            auth_request /__tenant_host_check;
            auth_request_set $tenant_primary_domain $upstream_http_x_primary_domain;
            if ($tenant_primary_domain != "") {
                return 301 $tenant_primary_domain$request_uri;
            }
            proxy_pass http://$frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Tenant-Domain $host;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
