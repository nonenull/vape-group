services:
  # Golang 后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vape-group-backend
    env_file: ".env"
    environment:
      PORT: 8088
      JWT_SECRET: vape-group-jwt-secret-key
      UPLOAD_DIR: /uploads
    ports:
      - "8088:8088"
    networks:
      - wp_network
    volumes:
      - ./backend:/app
      - ./uploads:/uploads
    restart: unless-stopped

  # 商城前端服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vape-group-frontend
    environment:
      VITE_API_URL: http://backend:8088
    ports:
      - "5273:80"
    networks:
      - wp_network
    depends_on:
      - backend
    restart: unless-stopped

  # 后台管理前端服务
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: vape-group-admin
    environment:
      VITE_API_URL: http://backend:8088
      VITE_APP_BASE: /fuck/
    ports:
      - "5274:80"
    networks:
      - wp_network
    depends_on:
      - backend
    restart: unless-stopped

  # Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: vape-group-nginx
    ports:
      - "8880:80"
      - "8843:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    networks:
      - wp_network
    depends_on:
      backend:
        condition: service_started
        restart: true
      frontend:
        condition: service_started
        restart: true
      admin:
        condition: service_started
        restart: true
    restart: unless-stopped

networks:
  wp_network:
    name: wp_network
    external: true
