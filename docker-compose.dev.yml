services:
  mysql:
    image: mysql:8.0
    container_name: vape-group-mysql-dev
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: vape_group
      MYSQL_USER: vape_user
      MYSQL_PASSWORD: vape_password
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - mysql_data_dev:/var/lib/mysql
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - vape-network-dev
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    image: golang:1.19-alpine
    container_name: vape-group-backend-dev
    working_dir: /app
    environment:
      PORT: 8088
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: vape_user
      DB_PASS: vape_password
      DB_NAME: vape_group
      JWT_SECRET: vape-group-jwt-secret-key
      TZ: Asia/Shanghai
      UPLOAD_DIR: /uploads
    command: sh -c "go mod download && go run ./cmd/main.go"
    ports:
      - "8088:8088"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./uploads:/uploads
      - go_pkg_mod:/go/pkg/mod
    networks:
      - vape-network-dev
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    container_name: vape-group-frontend-dev
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    networks:
      - vape-network-dev
    depends_on:
      - backend
    restart: unless-stopped

  admin:
    image: node:20-alpine
    container_name: vape-group-admin-dev
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5174"
    ports:
      - "5174:5174"
    volumes:
      - ./admin:/app
      - admin_node_modules:/app/node_modules
    networks:
      - vape-network-dev
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: vape-group-nginx-dev
    ports:
      - "8880:80"
    volumes:
      - ./nginx.dev.conf:/etc/nginx/nginx.conf:ro
    networks:
      - vape-network-dev
    depends_on:
      - backend
      - frontend
      - admin
    restart: unless-stopped

volumes:
  mysql_data_dev:
  go_pkg_mod:
  frontend_node_modules:
  admin_node_modules:

networks:
  vape-network-dev:
    driver: bridge
