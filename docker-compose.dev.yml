services:
  backend:
    image: golang:1.19-alpine
    container_name: vape-group-backend-dev
    working_dir: /app
    env_file: ".env"
    environment:
      PORT: 8088

      # DB_HOST: mysql
      # DB_PORT: 3306
      # DB_USER: vape_user
      # DB_PASS: vape_password
      # DB_NAME: vape_group
      JWT_SECRET: vape-group-jwt-secret-key
      TZ: Asia/Shanghai
      UPLOAD_DIR: /uploads
    command: sh -c "go mod download && go run ./cmd/main.go"
    ports:
      - "8088:8088"
    volumes:
      - ./backend:/app
      - ./uploads:/uploads
      - go_pkg_mod:/go/pkg/mod
    networks:
      - wp_network
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    container_name: vape-group-frontend-dev
    working_dir: /app
    environment:
      NUXT_SERVER_API_BASE: http://backend:8088
      NUXT_BUILD_DIR: /tmp/vape-group-frontend/.nuxt
      HOST: 0.0.0.0
      PORT: 3000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    networks:
      - wp_network
    depends_on:
      - backend
    restart: unless-stopped

  admin:
    image: node:20-alpine
    container_name: vape-group-admin-dev
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5174"
    ports:
      - "5174:5174"
    volumes:
      - ./admin:/app
      - admin_node_modules:/app/node_modules
    networks:
      - wp_network
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: vape-group-nginx-dev
    ports:
      - "8880:80"
    volumes:
      - ./nginx.dev.conf:/etc/nginx/nginx.conf:ro
    networks:
      - wp_network
    depends_on:
      - backend
      - frontend
      - admin
    restart: unless-stopped

volumes:
  mysql_data_dev:
  go_pkg_mod:
  frontend_node_modules:
  admin_node_modules:

networks:
  wp_network:
    name: wp_network
    external: true
